global
    daemon
    maxconn 4096

defaults
    mode tcp
    timeout connect 5000
    timeout client 50000
    timeout server 50000

listen mysql_master
    bind *:6033
    mode tcp
    option mysql-check user haproxy_check
    server master 192.168.20.20:3306 check inter 5s fall 3 rise 2

listen mysql_slave
    bind *:6032
    mode tcp
    option mysql-check user haproxy_check
    server slave 192.168.20.40:3306 check inter 5s fall 3 rise 2

# Página de estado - permite ver en vivo si HAProxy considera Up o Down
# a cada backend (clave para detectar la caída del Master)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin

